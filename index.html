    <title>Test d'oreille absolue</title>
    <script type="module" src="components/app-select.js" defer></script>
    <script type="module" src="app.js" defer></script>
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <h1>Test d'oreille absolue</h1>
        </header>
        <section class="card" id="setup">
            <label for="questionCount">Nombre de questions :</label>
            <app-select id="questionCount" value="100">
                <app-option value="20">20</app-option>
                <app-option value="50">50</app-option>
                <app-option value="100" selected>100</app-option>
            </app-select>
            <button id="startBtn">Commencer</button>
        </section>
        <section class="card" id="test">
            <p class="big">Question <span id="progress">1 / 100</span></p>
            <button id="playBtn">▶ Jouer la note</button>
            <audio id="audio" preload="auto"></audio>
            <div id="answerArea">
                <p>Ta réponse :</p>
                <app-select id="answer">
                    <app-option value="">-- Choisir une note --</app-option>
                    <app-option value="C">Do</app-option>
                    <app-option value="C#">Do♯ / Ré♭</app-option>
                    <app-option value="D">Ré</app-option>
                    <app-option value="D#">Ré♯ / Mi♭</app-option>
                    <app-option value="E">Mi</app-option>
                    <app-option value="F">Fa</app-option>
                    <app-option value="F#">Fa♯ / Sol♭</app-option>
                    <app-option value="G">Sol</app-option>
                    <app-option value="G#">Sol♯ / La♭</app-option>
                    <app-option value="A">La</app-option>
                    <app-option value="A#">La♯ / Si♭</app-option>
                    <app-option value="B">Si</app-option>
                </app-select>
                <button id="nextBtn">Valider et continuer</button>
            </div>
            <p class="muted" id="message"></p>
        </section>
        <section class="card" id="results">
            <h2>Résultats</h2>
            <p id="score"></p>
            <h3>Précision par note</h3>
            <div id="byNote"></div>
            <h3>Détail des erreurs</h3>
            <div id="mistakes"></div>
            <button id="restartBtn">Nouveau test</button>
        </section>
    </main>
</body>
