    <title>Test d'oreille absolue</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <h1>Test d'oreille absolue</h1>
        </header>
    <div class="card" id="setup">
        <label>
            Nombre de questions :
            <select id="questionCount">
                <option>20</option>
                <option>50</option>
                <option selected>100</option>
            </select>
        </label>
        <button id="startBtn">Commencer</button>
    </div>
    <div class="card" id="test">
        <p class="big">Question <span id="progress">1 / 100</span></p>
        <button id="playBtn">▶ Jouer la note</button>
        <audio id="audio" preload="auto"></audio>
        <div id="answerArea">
            <p>Ta réponse :</p>
            <select id="answer">
                <option value="">-- Choisir une note --</option>
                <option value="C">Do</option>
                <option value="C#">Do♯ / Ré♭</option>
                <option value="D">Ré</option>
                <option value="D#">Ré♯ / Mi♭</option>
                <option value="E">Mi</option>
                <option value="F">Fa</option>
                <option value="F#">Fa♯ / Sol♭</option>
                <option value="G">Sol</option>
                <option value="G#">Sol♯ / La♭</option>
                <option value="A">La</option>
                <option value="A#">La♯ / Si♭</option>
                <option value="B">Si</option>
            </select>
            <button id="nextBtn">Valider et continuer</button>
        </div>
        <p class="muted" id="message"></p>
    </div>
    <div class="card" id="results">
        <h2>Résultats</h2>
        <p id="score"></p>
        <h3>Précision par note</h3>
        <div id="byNote"></div>
        <h3>Détail des erreurs</h3>
        <div id="mistakes"></div>
        <button id="restartBtn">Nouveau test</button>
    </div>
        <script type="module" src="app.js" defer></script>
    </main>
</body>
